<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Collection Review</title>
<style>
:root{--bg:#0f1115;--card:#191c23;--bd:#262b36;--tx:#e6e8ee;--mut:#8a90a0;--acc:#4f8cff;--g:#3fbf6f;--o:#e8a33d;--r:#e55}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--bd);background:#12151c}
header a{color:var(--acc);text-decoration:none;font-size:13px}
h1{font-size:16px;margin:0;white-space:nowrap}
.progwrap{flex:1;height:8px;background:var(--card);border-radius:5px;overflow:hidden;margin:0 10px;min-width:120px}
#prog{height:100%;background:var(--g);width:0;transition:width .2s}
#progTxt{font-size:12px;color:var(--mut);white-space:nowrap}
.btns button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;margin-left:6px}
.btns button:hover{border-color:var(--acc)}
main{display:flex;height:calc(100vh - 50px)}
aside{width:330px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:#12151c}
.ctl{padding:10px;display:flex;gap:8px;border-bottom:1px solid var(--bd)}
.ctl input{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:7px 9px;border-radius:8px;font-size:13px}
.ctl select{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:7px;border-radius:8px;font-size:13px}
#list{flex:1;overflow-y:auto}
.li{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid #1d212b;cursor:pointer;font-size:13px}
.li:hover{background:#171b23}.li.on{background:var(--acc);color:#fff}
.li.on .ls,.li.on b{color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:#333}.dot.ok{background:var(--g)}.dot.flag{background:var(--r)}.dot.edit{background:var(--o)}
.ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls{color:var(--mut);font-size:11px}
.li b{color:var(--g);font-size:12px;font-weight:600}
.work{flex:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:16px}
.photo{width:min(300px,38vh);border-radius:10px;border:1px solid var(--bd);cursor:zoom-in}
.tk{font-size:20px;font-weight:700;margin:10px 0 2px}.tk.flag{color:var(--r)}.tk.ok{color:var(--g)}
.meta{color:var(--mut);font-size:13px}
.prices{display:flex;gap:26px;margin:10px 0;font-size:13px}
.prices b{font-size:18px;color:var(--acc)}
.stat{padding:3px 10px;border-radius:6px;font-size:11px;letter-spacing:.5px;margin-top:4px}
.stat.new{background:#222;color:var(--mut)}.stat.ok{background:#16321f;color:var(--g)}.stat.flag{background:#3a1616;color:var(--r)}.stat.edit{background:#3a2f10;color:var(--o)}
.editor{width:min(460px,94%);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editor label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:4px}
.editor input,.editor select{background:#10131a;border:1px solid var(--bd);color:var(--tx);padding:8px;border-radius:8px;font-size:13px}
.editor .full{grid-column:1/-1}
.warn{color:var(--o);font-size:12px}
.muted{color:var(--mut);font-size:12px}
textarea{background:#10131a;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px;font-size:13px;resize:vertical;min-height:56px;width:100%}
.rowbtns{display:flex;gap:8px;margin-top:10px;width:min(460px,94%)}
.rowbtns button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--bd);font-size:14px;font-weight:600;cursor:pointer}
#mkok{background:#1b5e34;color:#fff;border-color:#1b5e34}
#mkflag{background:#5e1b1b;color:#fff;border-color:#5e1b1b}
#apply{background:var(--acc);color:#fff;border-color:var(--acc)}
.nav{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px;margin-top:8px}
.nav button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
</style></head><body>
<header>
  <h1>Collection Review</h1>
  <div class="progwrap"><div id="prog"></div></div>
  <span id="progTxt"></span>
  <span class="btns">
    <button id="expJ" title="download corrections JSON">Export changes</button>
    <button id="expC" title="download updated CSV">Export CSV</button>
    <button id="reset">Reset</button>
    <a href="index.html">View site →</a>
  </span>
</header>
<main>
  <aside>
    <div class="ctl"><input id="q" placeholder="Search card or set…"><select id="filt"><option value="all">All</option><option value="new">Unreviewed</option><option value="ok">Approved</option><option value="flag">Flagged</option><option value="edit">Edited</option></select></div>
    <div id="list"></div>
  </aside>
  <div class="work">
    <a id="photoLnk" target="_blank"><img id="photo" class="photo" alt="scan"></a>
    <div class="tk" id="tname"></div>
    <div class="meta" id="tset"></div>
    <div class="meta" id="tqty"></div>
    <div class="meta" id="tid" style="opacity:.5;font-size:11px"></div>
    <div class="stat" id="stat"></div>
    <div class="prices"><div>Market <b id="val"></b></div><div>Sell 80% <b id="sell"></b></div><div><b id="liq"></b></div></div>
    <div class="editor">
      <label>Card name<input id="inpName"></label>
      <label>Set (re-prices)<select id="inpSet"></select></label>
      <label>Qty<input id="inpQty" type="number" min="1"></label>
      <label>Condition<select id="inpCond"><option>NM</option><option>LP</option><option>MP</option><option>HP</option><option>DMG</option></select></label>
      <label class="full"><span style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="inpFoil" style="width:auto"> Foil</span></label>
      <label class="full">Note / discrepancy<textarea id="note" placeholder="e.g. French copy, corner damage, set is wrong…"></textarea></label>
    </div>
    <div class="rowbtns">
      <button id="mkok">✓ Approve (A)</button>
      <button id="mkflag">! Flag (F)</button>
      <button id="apply">Save edits</button>
    </div>
    <div class="nav"><button id="prev">←</button><span id="pos"></span><button id="next">→</button><span class="muted">a=approve · f=flag · arrows=move</span></div>
  </div>
</main>

<script>
const DATA=window.REVDATA;
let S=load();
function load(){try{return JSON.parse(localStorage.getItem('mtgrev_v1'))||{}}catch(e){return {}}}
function save(){localStorage.setItem('mtgrev_v1',JSON.stringify(S))}
const $=s=>document.querySelector(s);
const C=DATA.cards;
let idx=0;
const COND=DATA.cond;

function money(v){return '$'+Number(v||0).toFixed(2)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function statusOf(c){
  if(S.st&&S.st[c.id])return S.st[c.id];
  if(S.edit&&S.edit[c.id])return 'edit';
  return 'new';
}
function cur(){return C[idx]}
function priceFor(c){
  const set=(S.edit&&S.edit[c.id]&&S.edit[c.id].set)||c.s;
  const foil=((S.edit&&S.edit[c.id]&&S.edit[c.id].foil!=null)?S.edit[c.id].foil:c.f);
  const pr=DATA.prints[c.n]&&DATA.prints[c.n][set];
  if(pr){ const p=foil?(pr.uf||pr.u):(pr.u||pr.uf); if(p)return parseFloat(p); }
  return c.p;
}
function condFor(c){return (S.cond&&S.cond[c.id])||'NM'}
function qtyFor(c){return (S.edit&&S.edit[c.id]&&S.edit[c.id].qty!=null)?S.edit[c.id].qty:c.q}
function nameFor(c){return (S.edit&&S.edit[c.id]&&S.edit[c.id].name)||c.n}
function setFor(c){return (S.edit&&S.edit[c.id]&&S.edit[c.id].set)||c.s}
function valFor(c){const p=priceFor(c);return p*qtyFor(c)*COND[condFor(c)]}
function setSel(c){ // selected set code
  return (S.edit&&S.edit[c.id]&&S.edit[c.id].set)||c.s;
}

function setOpts(c){
  const p=DATA.prints[c.n]||{};
  const sets=Object.keys(p);
  if(!sets.length){return '<option value="">'+esc(c.s)+' (no reprint data)</option>'}
  return sets.map(st=>{
    const pr=p[st];
    const lab=st+' — '+(pr.u?'$'+parseFloat(pr.u).toFixed(2):(pr.uf?'$'+parseFloat(pr.uf).toFixed(2):'n/a'));
    return '<option value="'+esc(st)+'"'+(st===setSel(c)?' selected':'')+'>'+esc(lab)+'</option>';
  }).join('');
}

function render(){
  idx=Math.max(0,Math.min(idx,C.length-1));
  const c=cur();
  if(!c){return}
  const pr=priceFor(c), val=valFor(c), sell=val*0.72;
  const st=statusOf(c);
  const nm=nameFor(c), set=setFor(c);
  $('#photo').src=c.im||c.img;
  $('#photoLnk').href=c.im||c.img;
  $('#tname').textContent=nm;
  $('#tname').className=st==='flag'?'tk flag':(st==='ok'?'tk ok':'tk');
  $('#tset').textContent=set+' ('+(c.c||'?')+')';
  $('#tqty').textContent=qtyFor(c)+' copies';
  $('#tid').textContent=c.id;
  $('#inpName').value=nm;
  $('#inpSet').innerHTML=setOpts(c);
  $('#inpQty').value=qtyFor(c);
  $('#inpCond').value=condFor(c);
  $('#inpFoil').checked=((S.edit&&S.edit[c.id]&&S.edit[c.id].foil!=null)?S.edit[c.id].foil:c.f)===1;
  $('#note').value=(S.note&&S.note[c.id])||'';
  const diff=Math.abs(pr-c.p)>0.01;
  $('#val').innerHTML='<b>'+money(val)+'</b> <span class="muted">each '+money(pr)+' × '+qtyFor(c)+' × '+esc(condFor(c))+'</span>'+(diff?' <span class="warn">re-priced (was '+money(c.p)+')</span>':'');
  $('#sell').textContent=money(sell);
  $('#liq').textContent='Liquidity '+c.l;
  $('#pos').textContent=(idx+1)+' / '+C.length;
  $('#stat').textContent=st==='ok'?'APPROVED':st==='flag'?'FLAGGED':st==='edit'?'EDITED':'UNREVIEWED';
  $('#stat').className='stat '+st;
  renderSide();
}

function renderSide(){
  const q=$('#q').value.toLowerCase();
  const f=$('#filt').value;
  const box=$('#list');
  let h='';let shown=0;
  for(let i=0;i<C.length;i++){
    const c=C[i];const st=statusOf(c);
    if(f!=='all'&&st!==f)continue;
    if(q&&!c.n.toLowerCase().includes(q)&&!c.s.toLowerCase().includes(q))continue;
    shown++;
    h+='<div class="li '+(i===idx?'on':'')+'" data-i="'+i+'" title="'+esc(c.n)+' · '+esc(c.s)+'">'
      +'<span class="dot '+st+'"></span><span class="ln">'+esc(c.n)+'</span><span class="ls">'+esc(c.s)+'</span>'
      +'<b>'+money(c.v)+'</b></div>';
  }
  box.innerHTML=h;
  const done=C.filter(c=>statusOf(c)!=='new').length;
  $('#prog').style.width=(done/C.length*100)+'%';
  $('#progTxt').textContent=done+'/'+C.length+' reviewed · '+shown+' shown';
  box.querySelectorAll('.li').forEach(el=>el.onclick=()=>{idx=+el.dataset.i;render()});
}

function go(d){idx+=d;render()}
function mark(st){
  S.st=S.st||{};S.st[cur().id]=st;
  if(st==='new')delete S.st[cur().id];
  save();render();
}
function applyEdit(){
  const c=cur();S.edit=S.edit||{};const e=S.edit[c.id]||{};
  const nm=$('#inpName').value.trim();
  const set=$('#inpSet').value;
  const qty=parseInt($('#inpQty').value)||c.q;
  const cond=$('#inpCond').value;
  const foil=$('#inpFoil').checked?1:0;
  if(nm!==c.n)e.name=nm;
  if(set!==c.s)e.set=set;
  if(qty!==c.q)e.qty=qty;
  if(foil!==c.f)e.foil=foil;
  if(nm===c.n)delete e.name; if(set===c.s)delete e.set; if(qty===c.q)delete e.qty; if(foil===c.f)delete e.foil;
  if(Object.keys(e).length)S.edit[c.id]=e; else delete S.edit[c.id];
  S.cond=S.cond||{}; S.cond[c.id]=cond;
  S.note=S.note||{}; const nt=$('#note').value.trim(); if(nt)S.note[c.id]=nt; else delete S.note[c.id];
  if(S.st&&S.st[c.id]==='flag'&&$('#markok').classList.contains('primary')){delete S.st[c.id]}
  save();render();
}
function exportJSON(){
  const out={approved:[],corrected:[],conditions:{},notes:{},reviewed:Object.keys(S.st||{})};
  C.forEach(c=>{
    const st=statusOf(c);
    const e=S.edit&&S.edit[c.id];
    if(e&&Object.keys(e).length){
      out.corrected.push({cid:c.id,name:nameFor(c),set:setFor(c),qty:qtyFor(c),foil:(e.foil!=null?e.foil:c.f),orig_name:c.n,orig_set:c.s,orig_price:c.p});
    }
    if(st==='ok')out.approved.push(c.id);
  });
  out.conditions=S.cond||{}; out.notes=S.note||{};
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mtg_review_changes.json';a.click();
}
function exportCSV(){
  let rows=[['Card Name','Set','Set Code','Rarity','Foil','Qty','Condition','Price Each','Market Value','Sell 80%','Liquidity','Photo URL']];
  C.forEach(c=>{
    const e=S.edit&&S.edit[c.id];
    const cond=condFor(c);
    const p=priceFor(c);
    rows.push([nameFor(c),setFor(c),c.c,c.r,(e&&e.foil!=null?e.foil:c.f)?'yes':'',qtyFor(c),cond,
      p.toFixed(2),valFor(c).toFixed(2),(valFor(c)*0.72).toFixed(2),c.l,c.im]);
  });
  const csv=rows.map(r=>r.map(f=>'"'+String(f).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='mtg_collection_approved.csv';a.click();
}
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
  else if(e.key==='a'||e.key==='A'){mark('ok')}
  else if(e.key==='f'||e.key==='F'){mark('flag')}
  else if(e.key==='Enter'){go(1)}
});
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
$('#mkok').onclick=()=>{mark('ok');go(1)};
$('#mkflag').onclick=()=>{mark('flag')};
$('#apply').onclick=applyEdit;
$('#expJ').onclick=exportJSON;$('#expC').onclick=exportCSV;
$('#q').oninput=renderSide;$('#filt').onchange=renderSide;
$('#inpSet').onchange=applyEdit;$('#inpCond').onchange=applyEdit;$('#inpQty').onchange=applyEdit;$('#inpFoil').onchange=applyEdit;
$('#reset').onclick=()=>{if(confirm('Clear ALL review state?')){localStorage.removeItem('mtgrev_v1');location.reload()}};
render();
</script>
